# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: pwsh-updater

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: pwsh-updater
    env:
      - CGO_ENABLED=0
    # L'outil installe PowerShell pour Linux : inutile de builder le reste.
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    # Nomme les archives comme le ferait `uname` (pwsh-updater_Linux_x86_64).
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm" }}armv{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

# Version utilisée pour les builds locaux (--snapshot), sans tag git.
snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
